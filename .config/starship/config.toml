add_newline = false
scan_timeout = 30
command_timeout = 100
format = """\
    $username\
    $hostname\
    $directory\
    $git_branch\
    $git_commit\
    $git_state\
    $git_status\
    $git_metrics\
    $hg_branch\
    $env_var\
    $docker_context\
    $kubernetes\
    $aws\
    $gcloud\
    $package\
    $dotnet\
    $elixir\
    $elm\
    $erlang\
    $golang\
    $java\
    $julia\
    $nodejs\
    $ocaml\
    $php\
    $purescript\
    $python\
    $ruby\
    $rust\
    $terraform\
    $zig\
    $mise\
    $nix_shell\
    $conda\
    $memory_usage\
    $crystal\
    $cmd_duration\
    $custom\
    $line_break\
    $jobs\
    $battery\
    $time\
    $character\
"""

palette = "tokyonight"

[palettes.tokyonight]
red = "#f7768e"
orange = "#ff9e64"
yellow = "#e0af68"
green = "#9ece6a"
cyan = "#7dcfff"
blue = "#7aa2f7"
magenta = "#bb9af7"
comment = "#565f89"

[profiles]
# transient prompt (fish): 過去のプロンプトを時刻と character だけに圧縮する
transient = "$time$character"

[character]
success_symbol = "[ ::](green)"
error_symbol = "[ ✗](red)"
vicmd_symbol = "[ ::](green)"

[hostname]
ssh_only = true
disabled = false
style = "yellow"

[directory]
truncation_length = 3
truncate_to_repo = false
style = "cyan"
format = "👻 [$path]($style)[$read_only]($read_only_style) "

[time]
disabled = false
format = "[$time]($style)"
time_format = "%T"
utc_time_offset = "+9"
style = "comment"

[gcloud]
symbol = '️🇬️ '
#format = 'on [$symbol$account(@$domain)(\($region\))(\($project\))]($style) '
format = 'on [(\($region\))(\($project\))]($style) '
style = 'blue'
# detect_env_vars = ['GOOGLE_APPLICATION_CREDENTIALS']
[gcloud.region_aliases]
us-central1 = 'uc1'
asia-northeast1 = 'an1'

[aws]
symbol = "☁️ "
style = "orange"
[aws.region_aliases]
ap-northeast-1 = "tokyo"
ap-northeast-3 = "osaka"
us-east-1 = "va"
us-east-2 = "oh"
us-west-1 = "ca"
us-west-2 = "or"
#[aws.profile_aliases]
#'sandbox' = 'sandbox'

[docker_context]
symbol = "🐋 "

[git_branch]
symbol = "🚀 "
#truncation_length = 2
#truncation_symbol = ""
style = "magenta"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[PICKING](bold red)"

[git_status]
ignore_submodules = true
ahead = ""
behind = ""
diverged = "⇕"
conflicted = "="
untracked = "?"
# stash があっても git status が clean なら branch 名だけにする
stashed = ""
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_metrics]
disabled = false

[golang]
#symbol = "🏎💨 "
style = "cyan"

[kubernetes]
symbol = "🥑 "
style = "yellow"
disabled = false
format = '[$symbol$context( \($namespace\))]($style) in '
detect_extensions = []
detect_files = ['k8s', 'Dockerfile', 'docker-compose.yml', 'docker-compose.yaml', 'helmfile.yaml', 'helmfile.yml']
detect_folders = ['k8s', 'helm', 'kubernetes', '.kube']
[kubernetes.context_aliases]
"dev.local.cluster.k8s" = "dev"

[nodejs]
symbol = "🤖 "

[python]
# symbol = "👾 "
pyenv_version_name = true
pyenv_prefix = "foo "

[ruby]
symbol = "🔺 "

[terraform]
format = "via [$symbol$version]($style) "

[mise]
# プロンプト描画の約 30ms を占めるため無効化（表示は health の ✔️/❌ のみ）
disabled = true
symbol = 'mise '
style = 'orange'
format = 'on [$symbol$health]($style) '
healthy_symbol = '✔️ '
unhealthy_symbol = '❌ '

[battery]
disabled = true

[conda]
disabled = true

[crystal]
disabled = true

[dotnet]
disabled = true

[elixir]
disabled = true

[elm]
disabled = true

[erlang]
disabled = true

[java]
disabled = true

[julia]
disabled = true

[hg_branch]
disabled = true

[nix_shell]
disabled = true

[ocaml]
disabled = true

[php]
disabled = true

[rust]
disabled = true

[singularity]
disabled = true

[zig]
disabled = false

[purescript]
disabled = true
