# herdr 設定
# キー一覧と既定値: `herdr --default-config`
# 検証: `herdr config check`

# 初回起動時の通知設定画面を出さない
onboarding = false

# テーマ
[theme]
name = "tokyo-night"

auto_switch = false
[theme.custom]
# 非アクティブタブの背景を薄いグレー紫にして視認できるようにする
surface0 = "#4c4869"
surface1 = "#5a5680"
# 非アクティブタブの文字色を白にする (overlay1=通常タブ文字)
overlay1 = "#ffffff"
# 非フォーカスのペイン枠を tokyo-night 既定 (#565f89) より少し暗くする
# overlay0 はサイドバー等の淡い文字にも使われるため、そちらも少し暗くなる
overlay0 = "#404665"

# ペイン
[terminal]
new_cwd = "follow"

# キーバインド
[keys]
prefix = "ctrl+t"
split_vertical = "prefix+|"
split_horizontal = "prefix+\""
previous_workspace = "prefix+comma"
next_workspace = "prefix+m"
detach = "prefix+d"
toggle_sidebar = "prefix+b"
# prefix+1..9 は sidebar の workspace 切替に使う。既定の switch_tab と衝突するため tab 側は無効化
switch_workspace = "prefix+1..9"
switch_tab = ""
# prefix+w は pane-picker に使う
workspace_picker = ""

# holo をフローティングで開き、選んだセッションは元のペインで再開する
[[keys.command]]
key = "prefix+i"
type = "popup"
command = "~/.config/herdr/holo-popup.sh"
width = "80%"
height = "80%"

# 全ペインを fzf で選んで移動する。prefix+w は既定で workspace_picker のため外す
[[keys.command]]
key = "prefix+w"
type = "popup"
command = "~/.config/herdr/pane-picker.py"
width = "80%"
height = "80%"

# git worktree
[worktrees]
directory = "~/gm/.worktrees"

# UI
[ui]
# accent = "#A78BFA"
accent = "#A066FF"
tab_bar_right = [{ type = "datetime", format = "%H:%M" }]
pane_scrollbars = false
show_agent_labels_on_pane_borders = true
sidebar_width = 18
sidebar_min_width = 18
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"

# 通知
[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[advanced]
# ペインあたりの scrollback 上限 (500 MiB)
scrollback_limit_bytes = 524288000
